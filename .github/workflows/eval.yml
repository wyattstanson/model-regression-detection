name: Eval — Prompt Regression Check

on:
  pull_request:
    paths:
      - "prompts/**"
      - "golden_dataset/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # needed to post PR comment
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect changed prompt version
        id: prompt_version
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- prompts/ | head -1)
          VERSION=$(basename "$CHANGED" .yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected prompt version: $VERSION"

      - name: Run eval
        id: eval
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          PROMPT_VERSION:      ${{ steps.prompt_version.outputs.version }}
          EVAL_WARN_THRESHOLD: "0.03"
          EVAL_CRITICAL_THRESHOLD: "0.08"
          USE_JUDGE: "true"
        run: |
          python -m src.ci_run 2>&1 | tee eval_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('eval_output.txt', 'utf8');

            // Extract the PR comment block between the markers
            const match = output.match(/PR COMMENT PAYLOAD:\n[-]+\n([\s\S]+?)\n[-]+/);
            const body = match ? match[1] : '⚠️ Could not parse eval output.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/*.html
          retention-days: 30

      - name: Block merge on critical regression
        if: steps.eval.outputs.exit_code == '1'
        run: |
          echo "::error::Critical regression detected. Merge blocked."
          exit 1